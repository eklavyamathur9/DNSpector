name: Publish to PyPI

# Only runs when a GitHub Release is published (a deliberate, manual action -
# see https://github.com/eklavyamathur9/Dns-Analyser/releases/new). Uses PyPI
# "Trusted Publishing" (OIDC) - no API token/secret stored in this repo.
# This requires a one-time setup step on pypi.org before it can succeed; see
# CONTRIBUTING.md "Publishing a release" for the full walkthrough.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dns-analyzer/
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
